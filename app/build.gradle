plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whispertflite'
    compileSdk 35

    lint {
        disable += 'MissingTranslation'
    }
    
    defaultConfig {
        applicationId "org.woheller69.whisper"
        minSdk 28
        targetSdk 35
        versionCode 38
        versionName "3.8"

        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Inherits ndk.abiFilters from defaultConfig
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packaging {
        jniLibs {
            // Resolves conflict between WebRTC VAD and Sherpa-ONNX shared C++ runtime
            pickFirsts.add("**/libc++_shared.so")
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.github.gkonovalov.android-vad:webrtc:2.0.10'
    implementation 'com.github.houbb:opencc4j:1.14.0'
    implementation 'com.github.woheller69:FreeDroidWarn:+'

    // Ensure ONLY ONE sherpa-onnx armeabi-v7a AAR is in the libs folder
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
