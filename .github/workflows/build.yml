name: Build MoonshineIME APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Download prebuilt Sherpa-ONNX AAR into app/libs before compiling Kotlin
      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          ls -lh app/libs/

      - name: Clean environment and Build APK
        run: |
          rm -f local.properties
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonshineIME-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
